            {q:"若口腔潰瘍超過兩週未癒應 ：",options:["忍耐", "服止痛藥", "就醫檢查", "用鹽水漱口"],a:"就醫檢查"},
            {q:"抽菸造成口腔健康的影響為 ：",options:["牙齦退縮", "牙周病", "牙齒變黃", "以上皆是"],a:"以上皆是"},
            {q:"檳榔中主要致癌成分為 ：",options:["檳榔鹼", "酒精", "尼古丁", "糖"],a:"檳榔鹼"},
            {q:"使用他人牙刷會增加下列何者的風險 ？",options:["感染疾病", "蛀牙", "鼻炎", "遺傳病"],a:"感染疾病"},
            {q:"定期口腔檢查建議頻率為 ：",options:["每月一次", "每三至六個月一次", "每年一次", "兩年一次"],a:"每三至六個月一次"},
            {q:"下列何者屬於口腔癌早期症狀 ？",options:["白斑或紅斑", "無痛潰瘍", "口臭", "以上皆是"],a:"以上皆是"},
            {q:"若牙痛時自行服止痛藥 ，可能導致 ：",options:["治標不治本", "延誤病情", "齒髓炎惡化", "以上皆是"],a:"以上皆是"},
            {q:"若牙外傷造成牙齒脫落 ，最理想保存介質為 ：",options:["牛奶", "冰塊", "酒精", "乾紙巾"],a:"牛奶"},
            {q:"哪個選項為維護公共口腔衛生的良好行為 ？",options:["不共用牙刷", "定期檢查", "不隨地吐痰", "以上皆是"],a:"以上皆是"},
            {q:"為維護學校口腔衛生 ，下列哪項錯誤 ？",options:["午餐後潔牙", "借用同學牙刷", "定期塗氟", "每年牙檢"],a:"借用同學牙刷"},
            {q:"下列哪個屬於不良口腔衛生習慣 ？",options:["抽菸嚼檳榔", "吃完飯刷牙", "定期洗牙", "使用牙線"],a:"抽菸嚼檳榔"},
            {q:"檳榔嚼食後的口腔常見變化為 ：",options:["黏膜變粗糙或纖維化", "牙齦出血", "牙結石變少", "美白效果"],a:"黏膜變粗糙或纖維化"},
            {q:"世界衛生日與口腔衛生教育日的推廣目的為 ：",options:["強調健康口腔的重要性", "推銷牙膏", "促銷診所", "醫療收費"],a:"強調健康口腔的重要性"},
            {q:"若牙醫建議拔牙而患者恐懼不願配合 ，應：",options:["延遲治療", "與家長討論尋求醫師解釋", "自行服藥", "忍耐不理"],a:"與家長討論尋求醫師解釋"},
            {q:"下列哪一種氟化物的應用屬於「全身性」應用？",options:["含氟牙膏", "飲水加氟", "塗氟漆", "含氟漱口水"],a:"飲水加氟"},
            {q:"牙周病最常見的早期症狀是？",options:["牙齒劇痛", "牙齦流血", "牙齒脫落", "牙齒變黑"],a:"牙齦流血"},
            {q:"含氟牙膏中氟離子濃度應達到多少 ppm 才具防齲效果？",options:["500", "800", "1000", "1500"],a:"1000"},
            {q:"牙線的主要功能是：",options:["清潔牙縫面", "剔牙縫殘渣", "美白牙齒", "防止牙齒鬆動"],a:"清潔牙縫面"},
            {q:"全口塗氟建議多久進行一次？",options:["三個月", "半年", "一年", "不必塗"],a:"半年"},
            {q:"窩溝封填主要針對哪類牙齒進行？",options:["門牙", "犬齒", "小臼齒", "恆牙大臼齒"],a:"恆牙大臼齒"},
            {q:"關於牙刷的選擇，下列何者正確？",options:["刷頭越長越好", "刷毛越硬越好", "刷頭大小適中、軟毛", "用越久越好"],a:"刷頭大小適中、軟毛"},
            {q:"預防齲齒的「二要」是指：",options:["要睡飽要吃飽", "要塗氟要封填", "要美白要矯正", "要漱口要剔牙"],a:"要塗氟要封填"},
            {q:"下列何者不屬於牙周組織？",options:["牙齦", "牙周韌帶", "牙釉質", "牙槽骨"],a:"牙釉質"},
            {q:"刷牙時牙齦流血最可能的原因是：",options:["刷太用力", "牙刷太舊", "牙齦發炎", "缺維他命C"],a:"牙齦發炎"},
            {q:"牙線進入牙縫時應呈什麼形狀包圍牙齒？",options:["直線", "L形", "C形", "S形"],a:"C形"},
            {q:"下列何者不是政府補助的口腔保健方案？",options:["國小窩溝封填", "半年定期塗氟", "免費植牙", "牙周病統合治療"],a:"免費植牙"},
            {q:"刷牙的主要目的是移除：",options:["食物殘渣", "牙菌斑", "牙結石", "口水"],a:"牙菌斑"},
            {q:"成人全口共有幾顆恆牙(含智齒)？",options:["20顆", "28顆", "32顆", "36顆"],a:"32顆"},
            {q:"六歲牙是指哪一顆牙？",options:["乳門牙", "恆中門牙", "第一大臼齒", "第二小臼齒"],a:"第一大臼齒"},
            {q:"使用牙線時，牙線在牙縫中移動的範圍應該是？",options:["只在牙縫口", "深入牙齦溝底", "只在牙冠", "隨便動"],a:"深入牙齦溝底"},
            {q:"齲齒(蛀牙)產生的四大因素不包括？",options:["牙齒(宿主)", "細菌", "食物(醣類)", "口水"],a:"口水"},
            {q:"氟化物可以預防齲齒的主要原因是：",options:["增加牙釉質抗酸力", "抑制細菌生長", "幫助礦物質再鈣化", "以上皆是"],a:"以上皆是"},
            {q:"預防牙周病最有效的方法是：",options:["使用漱口水", "徹底潔牙(刷牙及牙線)", "吃維他命", "多喝牛奶"],a:"徹底潔牙(刷牙及牙線)"},
            {q:"貝氏刷牙法建議刷毛與牙長軸呈幾度角？",options:["0度", "45度", "90度", "180度"],a:"45度"},
            {q:"定期接受學校牙醫檢查可早期發現問題。",options:["對","錯"],a:"對"},
            {q:"衛生教育能幫助建立正確的口腔保健觀念。",options:["對","錯"],a:"對"},
            {q:"預防牙病應從小培養良好習慣。",options:["對","錯"],a:"對"}
        ];

        let state = { userName: "", quiz: [], current: 0, score: 0 };

        async function refreshBoard() {
            try {
                // 排行榜設定：只列出前 50 名
                const q = query(collection(db, "leaderboard"), orderBy("totalScore", "desc"), limit(50));
                const snap = await getDocs(q);
                document.getElementById('boardList').innerHTML = snap.docs.map((d, i) => `
                    <div class="flex justify-between p-3 border-b border-slate-100 items-center">
                        <span class="font-bold text-slate-600">${i+1}. ${d.id}</span>
                        <span class="font-black text-indigo-600">${d.data().totalScore} 分</span>
                    </div>`).join('') || '<p class="p-4 text-slate-400 text-sm text-center">目前尚無排名</p>';
            } catch (e) { console.log("載入中..."); }
        }

        window.startGame = () => {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) return alert("請輸入姓名！");
            state.userName = name;
            // 每次測驗抽出 20 題
            state.quiz = [...ALL_QUESTIONS].sort(() => 0.5 - Math.random()).slice(0, 20);
            state.current = 0; state.score = 0;
            showView('quiz-page'); renderQuiz();
        };

        window.handleAnswer = async (ans) => {
            const correctAnswer = state.quiz[state.current].a;
            
            // 跳出視窗告知是否答對
            if (ans === correctAnswer) {
                state.score += 5; // 20題，每題5分，滿分100
                alert("✅ 太棒了！答對了！");
            } else {
                alert("❌ 答錯囉！正確答案是： " + correctAnswer);
            }

            if (state.current < 19) {
                state.current++; renderQuiz();
            } else {
                const userRef = doc(db, "leaderboard", state.userName);
                await setDoc(userRef, { totalScore: increment(state.score) }, { merge: true });
                document.getElementById('finalScore').innerText = state.score;
                showView('result');
            }
        };

        function renderQuiz() {
            const q = state.quiz[state.current];
            document.getElementById('qText').innerText = q.q;
            document.getElementById('qNum').innerText = `第 ${state.current + 1} / 20 題`;
            document.getElementById('qOptions').innerHTML = q.options.map(opt => `
                <button onclick="handleAnswer('${opt}')" class="w-full text-left p-5 border-2 border-slate-100 rounded-2xl mb-4 hover:border-indigo-500 hover:bg-indigo-50 transition active:scale-95 font-medium">${opt}</button>
            `).join('');
        }

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        window.onload = refreshBoard;
    </script>
</head>
<body class="bg-indigo-50 flex items-center justify-center min-h-screen p-4 font-sans">
    <div class="bg-white w-full max-w-md rounded-[3rem] shadow-2xl p-10 min-h-[650px] flex flex-col border border-white">
        
        <div id="login-page" class="view my-auto">
            <div class="text-center">
                <div class="bg-indigo-100 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 text-4xl">🦷</div>
                <h1 class="text-3xl font-black text-slate-800 mb-2">潔牙知識王</h1>
                <p class="text-slate-400 mb-10 text-sm font-bold">每次 20 題 • 答題即時回饋</p>
                <input type="text" id="nameInput" placeholder="輸入姓名 (例: 王小明)" class="w-full p-5 bg-slate-50 rounded-2xl mb-6 text-center text-xl focus:ring-4 focus:ring-indigo-100 outline-none transition border-none">
                <button onclick="startGame()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold text-xl shadow-xl shadow-indigo-200 hover:bg-indigo-700 active:scale-95 transition">開始挑戰</button>
            </div>
            
            <div class="mt-12">
                <h3 class="font-black text-slate-400 text-xs uppercase tracking-widest mb-4">🏆 全校總積分排行榜 Top 50</h3>
                <div id="boardList" class="bg-slate-50 rounded-3xl p-2 border border-slate-100"></div>
            </div>
        </div>

        <div id="quiz-page" class="view hidden my-auto">
            <div id="qNum" class="text-xs font-black text-indigo-400 mb-4 tracking-widest uppercase text-center"></div>
            <h2 id="qText" class="text-2xl font-bold mb-10 leading-snug text-slate-800 min-h-[150px]"></h2>
            <div id="qOptions"></div>
        </div>

        <div id="result" class="view hidden text-center my-auto">
            <div class="text-7xl mb-8">🎖️</div>
            <h2 class="text-3xl font-black text-slate-800">挑戰完成！</h2>
            <p class="text-slate-400 mt-3 font-medium">本次獲得積分</p>
            <div class="text-9xl font-black text-indigo-600 my-10"><span id="finalScore"></span></div>
            <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold shadow-2xl active:scale-95 transition">返回排名</button>
        </div>
    </div>
</body>
</html>
